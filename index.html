<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Votre IP ...</title><meta name="description" content="Découvrez rapidement à votre adresse IP publique actuelle."><style>body{text-align:center;background:url(/mon-ip/assets/bg-UTR_jZso.jpg) 0 0/cover;flex-direction:column;justify-content:center;align-items:center;height:100vh;margin:0;font-family:sans-serif;display:flex}.text{color:#fff;text-transform:uppercase;opacity:0;margin:0;font-size:clamp(1em,10vw,6em);font-weight:700;transition:opacity .5s ease-in-out;position:relative}</style><script>async function fetchLocalIP() {
      try {
        const response = await fetch('https://checkip.amazonaws.com/');
        const ip = await response.text();
        document.getElementById('ip').textContent = ip;
        document.title = `Votre IP: ${ip}`;
      } catch (error) {
        console.error('Erreur lors de la récupération de l\'IP locale:', error);
        document.getElementById('ip').textContent = 'Erreur de récupération IP.';
      }
      document.querySelectorAll('.text').forEach(el => el.style.opacity = '1');
    }

    window.onload = fetchLocalIP;</script></head><body><main><div class="text">VOTRE IP</div><div class="text" id="ip">...</div></main></body></html>
